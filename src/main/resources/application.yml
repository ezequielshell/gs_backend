spring:
  application:
    name: solo-vivo-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/solo_vivo}
    username: ${DB_USER:solovivo}
    password: ${DB_PASSWORD:solovivo}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema e criado pelos scripts em /database (dump do time de banco de dados).
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
  error:
    include-stacktrace: never
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    br.com.fiap.solovivo: INFO

solovivo:
  timezone: America/Sao_Paulo
  jwt:
    # Em producao defina a variavel JWT_SECRET (minimo 32 caracteres).
    secret: ${JWT_SECRET:dev-somente-local-troque-este-segredo-solo-vivo-2026}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:480}
  cors:
    origens-permitidas: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  seguranca:
    login-max-tentativas: 5
    login-bloqueio-minutos: 5
  irrigacao:
    # Seguranca da automacao: intervalo minimo entre dois ciclos automaticos.
    intervalo-minimo-entre-ciclos-min: 30
    # Acima desta temperatura do ar e aberto o alerta "temperatura_alta".
    temperatura-alta-c: 35
  bomba-simulada:
    # true = a bomba simulada recusa comandos (util para demonstrar o CT-08).
    falhar: ${BOMBA_SIMULADA_FALHAR:false}
  monitoramento:
    # Rotina periodica: encerra irrigacoes que passaram do tempo maximo e
    # abre alertas de "sem leitura do sensor".
    habilitado: true
    intervalo-ms: 60000
  mqtt:
    # Integracao com o ESP32 (solo-vivo-arduino/sketch.ino). Ligue com MQTT_ENABLED=true.
    # Desligado, a API funciona so com o simulador HTTP e a bomba simulada.
    habilitado: ${MQTT_ENABLED:false}
    # Mesmo broker publico usado pelo firmware e pelo Node-RED.
    broker-url: ${MQTT_BROKER_URL:tcp://broker.hivemq.com:1883}
    # Em broker publico o client id precisa ser unico.
    client-id: ${MQTT_CLIENT_ID:solo-vivo-api-${random.uuid}}
    # Topicos: {base}/{identificador}/telemetria | irrigacao | status | config | config/ack | comando
    topico-base: ${MQTT_TOPICO_BASE:fiap/iot/3esoa/tech-group/solovivo}
    # Tempo maximo para o ESP32 confirmar um comando (evento em /irrigacao).
    timeout-confirmacao-s: 8
